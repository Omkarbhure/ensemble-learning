<div class="validation-alert-box">
    <div class="validation-alert-title">
        <span class="alert-icon">⚠️</span>
        <span>{title}</span>
    </div>
    <div class="validation-alert-body">
        <p><strong>Validation Rule:</strong> {description}</p>
        <p class="validation-tip">👉 <strong>What to do:</strong> Please draw or upload only a single handwritten character (digit <strong>0–9</strong>, letter <strong>A–Z / a–z</strong>, or symbol).</p>
    </div>
</div>
